name: mscas_final_app
description: "Mobile Smart Classroom Application System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI / State Management
  google_fonts: ^6.1.0
  provider: ^6.0.5

  # Supabase backend / authentication
  supabase_flutter: ^2.10.0

  # Camera / Images
  camera: ^0.10.5
  image_picker: ^1.0.4
  image: ^4.0.17

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.0.1

  # Local Storage / Utilities
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  awesome_dialog: ^3.1.3
  connectivity_plus: ^5.0.1
  file_picker: ^8.1.7
  face_plugin: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true